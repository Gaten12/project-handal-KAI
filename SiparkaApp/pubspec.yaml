name: kai_checkin
description: SIPARKA - Sistem Inspeksi Perangkat Kereta Api
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  file_picker: any
  path_provider: any
  excel: any
  share_plus: any
  google_fonts: any
  shared_preferences: any
  http: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_icons:
  android: true
  ios: false
  image_path: "assets/Logo_app.png"
  remove_alpha_ios: true
